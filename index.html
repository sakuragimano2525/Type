<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>タイプ相性チャート＋オリジナル技</title>
<style>
  :root{
    --bg:#0e1116;
    --panel:#161b22;
    --panel-2:#1c2330;
    --line:#2a3140;
    --text:#e8ecf2;
    --sub:#8892a0;
    --accent:#4da8ff;

    --c-supereff:#ff9d2f; /* x4 */
    --c-eff:#ff4d4d;      /* x2 */
    --c-half:#4da8ff;     /* x0.5 */
    --c-quarter:#37d67a;  /* x0.25 */
    --c-none:#8892a0;     /* x0 */

    --c-physical:#ff5e5e;
    --c-special:#4da8ff;
    --c-status:#6fcf97;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--text);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    overflow:hidden; overscroll-behavior:none;
  }
  #app{
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
  }

  /* ヘッダー */
  header{
    flex:0 0 auto;
    padding:10px 12px 6px;
    background:linear-gradient(180deg, var(--panel), rgba(22,27,34,0.0));
  }
  .tabs{
    display:flex; gap:6px;
    background:var(--panel-2);
    border-radius:12px;
    padding:4px;
    border:1px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 4px;
    border-radius:9px;
    font-size:13px;
    font-weight:700;
    color:var(--sub);
    letter-spacing:.02em;
    transition:background .15s, color .15s;
    user-select:none;
  }
  .tab.active{
    background:var(--accent);
    color:#08131f;
  }

  .toggles{
    display:flex; gap:8px;
    margin-top:8px;
  }
  .toggles.hide{ display:none; }
  .toggle{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:7px 6px;
    border-radius:10px;
    background:var(--panel-2);
    border:1px solid var(--line);
    font-size:12.5px;
    font-weight:600;
    color:var(--sub);
    user-select:none;
    transition:border-color .15s, color .15s;
  }
  .toggle.on{ color:var(--text); border-color:var(--accent); }
  .toggle .box{
    width:16px; height:16px; border-radius:4px;
    border:1.5px solid var(--sub);
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
    transition:background .15s, border-color .15s;
  }
  .toggle.on .box{ background:var(--accent); border-color:var(--accent); }
  .toggle .box svg{ width:11px; height:11px; opacity:0; transition:opacity .1s; }
  .toggle.on .box svg{ opacity:1; }

  .type-picker{
    display:none;
    flex-wrap:wrap;
    gap:5px;
    margin-top:8px;
    max-height:130px;
    overflow-y:auto;
    padding:2px 1px;
  }
  .type-picker.show{ display:flex; }
  .chip{
    padding:6px 10px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--line);
    font-size:11.5px;
    font-weight:600;
    color:var(--sub);
    display:flex; align-items:center; gap:4px;
    user-select:none;
  }
  .chip img{ width:14px; height:14px; border-radius:50%; object-fit:cover; }
  .chip.sel{ border-color:var(--accent); color:var(--text); background:rgba(77,168,255,.12); }

  /* メインエリア */
  #stage-wrap{
    flex:1 1 auto;
    position:relative;
    min-height:0;
    overflow:hidden;
  }
  #stage{
    position:absolute; inset:0;
    touch-action:none;
  }
  /* 技一覧コンテナ */
  #move-list{
    position:absolute; inset:0;
    overflow-y:auto;
    padding:8px 10px 20px;
    display:flex;
    flex-direction:column;
    gap:6px;
    background:var(--bg);
    -webkit-overflow-scrolling:touch;
  }
  .move-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 12px;
    display:grid;
    grid-template-columns: auto 1fr auto;
    gap:6px 12px;
    align-items:center;
  }
  .move-name{
    font-weight:700;
    font-size:15px;
    color:var(--text);
    grid-column:1;
    grid-row:1;
  }
  .move-type-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:2px 8px 2px 4px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    color:#fff;
    background:var(--sub);
    grid-column:2;
    grid-row:1;
    justify-self:start;
  }
  .move-type-badge img{
    width:18px; height:18px;
    border-radius:50%;
    object-fit:cover;
  }
  .move-category{
    grid-column:3;
    grid-row:1;
    font-size:12px;
    padding:2px 10px;
    border-radius:999px;
    font-weight:600;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--sub);
  }
  .move-category.physical{ border-color:var(--c-physical); color:var(--c-physical); }
  .move-category.special{ border-color:var(--c-special); color:var(--c-special); }
  .move-category.status{ border-color:var(--c-status); color:var(--c-status); }

  .move-details{
    grid-column:1 / -1;
    grid-row:2;
    display:flex;
    flex-wrap:wrap;
    gap:4px 16px;
    font-size:12px;
    color:var(--sub);
    border-top:1px solid var(--line);
    padding-top:6px;
  }
  .move-details span{
    display:inline-flex;
    align-items:center;
    gap:4px;
  }
  .move-details .label{ color:var(--sub); font-weight:400; }
  .move-details .value{ color:var(--text); font-weight:500; }
  .move-effect{
    grid-column:1 / -1;
    grid-row:3;
    font-size:12.5px;
    color:var(--text);
    background:var(--panel);
    padding:4px 8px;
    border-radius:6px;
    border-left:3px solid var(--accent);
  }
  .move-effect .chance{
    display:inline-block;
    background:rgba(77,168,255,.15);
    color:var(--accent);
    font-weight:600;
    padding:0 6px;
    border-radius:4px;
    margin-left:6px;
    font-size:11px;
  }

  /* 凡例 */
  #legend{
    flex:0 0 auto;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:8px 10px 10px;
  }
  #legend.hide{ display:none; }

  .legend-row{
    display:flex;
    justify-content:space-between;
    gap:4px;
  }
  .legend-item{
    flex:1;
    display:flex; flex-direction:column; align-items:center;
    gap:3px;
  }
  .legend-arrow{
    width:100%; height:10px;
  }
  .legend-text{
    font-size:9.5px;
    color:var(--sub);
    text-align:center;
    line-height:1.25;
    white-space:nowrap;
  }
  .legend-style-row{
    display:flex; justify-content:center; gap:26px;
    margin-top:8px;
  }
  .legend-style-item{
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .legend-style-item svg{ width:46px; height:14px; }
  .legend-style-item .legend-text{ font-size:10px; }

  /* 全画面ボタン */
  #fs-hint{
    position:fixed;
    top:10px; right:10px;
    font-size:10.5px;
    color:var(--sub);
    background:rgba(22,27,34,.7);
    padding:5px 9px;
    border-radius:8px;
    border:1px solid var(--line);
    z-index:50;
    pointer-events:none;
    opacity:1;
    transition:opacity .6s ease;
  }
  #fs-hint.hide{ opacity:0; }

  #tooltip{
    position:absolute;
    left:50%; top:8px;
    transform:translateX(-50%);
    background:rgba(22,27,34,.92);
    border:1px solid var(--line);
    border-radius:10px;
    padding:6px 12px;
    font-size:12px;
    color:var(--text);
    display:none;
    white-space:nowrap;
    z-index:10;
    pointer-events:none;
  }

  /* スクロールバー */
  #move-list::-webkit-scrollbar{ width:4px; }
  #move-list::-webkit-scrollbar-track{ background:transparent; }
  #move-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>

function atkMul(atkKey, defKey){
  const row = CHART[atkKey];
  if(row && row[defKey] !== undefined) return row[defKey];
  return 1;
}
function atkMulVsMulti(atkKey, defKeys){
  return defKeys.reduce((acc,dk)=>acc*atkMul(atkKey,dk),1);
}
function moveMulVsMulti(atkKeys, defKeys){
  return Math.max(...atkKeys.map(ak=>atkMulVsMulti(ak,defKeys)));
}
function styleForMul(mul){
  if(mul === 0)   return {color:"var(--c-none)",   dash:false, key:"none"};
  if(mul >= 4)    return {color:"var(--c-supereff)",dash:false, key:"super"};
  if(mul === 2)   return {color:"var(--c-eff)",     dash:false, key:"eff"};
  if(mul === 0.5) return {color:"var(--c-half)",    dash:false, key:"half"};
  if(mul === 0.25)return {color:"var(--c-quarter)", dash:false, key:"quarter"};
  return null;
}

const legendRow = document.getElementById('legend-row');
const tooltip = document.getElementById('tooltip');

// ============================================================
// 凡例 (色指定をインラインスタイルに変更)
// ============================================================
function buildLegend(){
  const items = [
    {label:"効果超抜群", sub:"(×4)", color:"var(--c-supereff)"},
    {label:"効果抜群",   sub:"(×2)", color:"var(--c-eff)"},
    {label:"いまひとつ", sub:"(×0.5)", color:"var(--c-half)"},
    {label:"いまひとつ", sub:"(×0.25)", color:"var(--c-quarter)"},
    {label:"効果なし",   sub:"(×0)", color:"var(--c-none)"},
  ];
  legendRow.innerHTML = items.map(it=>`
    <div class="legend-item">
      <svg class="legend-arrow" viewBox="0 0 60 10" preserveAspectRatio="none">
        <line x1="1" y1="5" x2="46" y2="5" style="stroke:${it.color};" stroke-width="3"/>
        <polygon points="46,0 60,5 46,10" style="fill:${it.color};"/>
      </svg>
      <div class="legend-text">${it.label}<br>${it.sub}</div>
    </div>
  `).join('');
}
buildLegend();

// ============================================================
// タブ切替
// ============================================================
tabs.forEach(tab=>{
  tab.addEventListener('click', ()=>{
    tabs.forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;

    if(mode === 'original') {
      toggles.classList.add('hide');
      legend.classList.add('hide');
      typePicker.classList.add('show');
      if(selectedKeys.length < 1) selectedKeys = ['normal'];
      buildPicker();
    } else {
      toggles.classList.remove('hide');
      legend.classList.remove('hide');
      if(mode === 'single') {
        typePicker.classList.remove('show');
        if(selectedKeys.length > 1) selectedKeys = [selectedKeys[0] || 'normal'];
      } else { // dual
        typePicker.classList.add('show');
        if(selectedKeys.length < 1) selectedKeys = ['normal'];
        buildPicker();
      }
    }

    if(mode === 'original') {
      stage.style.display = 'none';
      moveList.style.display = 'flex';
      renderMoveList();
    } else {
      stage.style.display = 'block';
      moveList.style.display = 'none';
      render();
    }
  });
});

// ============================================================
// トグル
// ============================================================
toggleAtk.addEventListener('click', ()=>{
  atkOn = !atkOn;
  toggleAtk.classList.toggle('on', atkOn);
  if(mode !== 'original') render();
});
toggleDef.addEventListener('click', ()=>{
  defOn = !defOn;
  toggleDef.classList.toggle('on', defOn);
  if(mode !== 'original') render();
});

// ============================================================
// タイプピッカー
// ============================================================
function buildPicker(){
  typePicker.innerHTML = TYPES.map(t=>`
    <div class="chip ${selectedKeys.includes(t.key)?'sel':''}" data-key="${t.key}">
      <img src="${t.id}.png" onerror="this.style.display='none'">
      ${t.ja}
    </div>
  `).join('');
  typePicker.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const k = chip.dataset.key;
      const max = 2;
      if(selectedKeys.includes(k)){
        selectedKeys = selectedKeys.filter(x=>x!==k);
        if(selectedKeys.length === 0) selectedKeys = [k];
      } else {
        if(selectedKeys.length >= max) selectedKeys.shift();
        selectedKeys.push(k);
      }
      buildPicker();
      if(mode === 'original') renderMoveList();
      else render();
    });
  });
}

// ============================================================
// 円グラフ描画
// ============================================================
function render(){
  const wrap = document.getElementById('stage-wrap');
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  const cx = W/2, cy = H/2;
  const R = Math.min(W,H) * 0.36;
  const centerNodeR = Math.min(W,H) * 0.135;
  const nodeR = Math.min(W,H) * 0.052;

  const centerKeys = selectedKeys;
  const others = mode === 'single' ? TYPES : TYPES.filter(t=>!centerKeys.includes(t.key));

  const results = others.map(t=>{
    let atkMulVal = null, defMulVal = null;
    if(atkOn){
      atkMulVal = moveMulVsMulti(centerKeys, [t.key]);
    }
    if(defOn && mode !== 'move'){
      defMulVal = atkMulVsMulti(t.key, centerKeys);
    }
    return {type:t, atkMulVal, defMulVal};
  });

  const n = others.length;
  const angleStep = (Math.PI*2)/n;
  const startAngle = -Math.PI/2;
  results.forEach((r,i)=>{
    r.angle = startAngle + angleStep*i;
    r.x = cx + R*Math.cos(r.angle);
    r.y = cy + R*Math.sin(r.angle);
  });

  let svg = `<svg viewBox="0 0 ${W} ${H}">`;

  results.forEach(r=>{
    if(atkOn){
      const st = styleForMul(r.atkMulVal);
      if(st){
        svg += drawArrow(cx,cy,r.x,r.y, centerNodeR, nodeR, st.color, false, `atk-${r.type.key}`);
      }
    }
    if(defOn && mode !== 'move'){
      const st = styleForMul(r.defMulVal);
      if(st){
        svg += drawArrow(r.x,r.y,cx,cy, nodeR, centerNodeR, st.color, true, `def-${r.type.key}`);
      }
    }
  });

  results.forEach(r=>{
    svg += drawNode(r.x, r.y, nodeR, r.type, false);
  });

  if(centerKeys.length === 1){
    const t = T[centerKeys[0]];
    svg += drawNode(cx, cy, centerNodeR, t, true);
  } else {
    svg += drawDualCenter(cx, cy, centerNodeR, centerKeys);
  }

  svg += `</svg>`;
  stage.innerHTML = svg;
  applyNodeImages();
  attachNodeTapEvents();
  attachTapToFullscreen();
}

function drawArrow(x1,y1,x2,y2, r1,r2, color, dashed, id){
  const dx = x2-x1, dy = y2-y1;
  const dist = Math.sqrt(dx*dx+dy*dy) || 1;
  const ux = dx/dist, uy = dy/dist;
  const sx = x1 + ux*r1, sy = y1 + uy*r1;
  const ex = x2 - ux*(r2+9), ey = y2 - uy*(r2+9);
  const dash = dashed ? `stroke-dasharray="6 5"` : '';
  const markerId = `arrow-${id}`;
  return `
    <defs>
      <marker id="${markerId}" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L6,3 L0,6 Z" fill="${color}"/>
      </marker>
    </defs>
    <line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${color}" stroke-width="2.6" ${dash} marker-end="url(#${markerId})" opacity="0.92"/>
  `;
}

function drawNode(x,y,r,type,isCenter){
  const clipId = `clip-${type.key}-${isCenter?'c':'o'}-${Math.round(x)}-${Math.round(y)}`;
  const nodeAttr = isCenter ? '' : `data-node-key="${type.key}"`;
  // 背景の塗りつぶし円を削除（fill="none"）
  return `
    <g ${nodeAttr}>
      <circle class="node-circle ${isCenter?'center':''}" cx="${x}" cy="${y}" r="${r}" fill="none"></circle>
      <clipPath id="${clipId}">
        <circle cx="${x}" cy="${y}" r="${r}"></circle>
      </clipPath>
      <image class="node-img" data-type-id="${type.id}" x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}"
        clip-path="url(#${clipId})" preserveAspectRatio="xMidYMid slice"/>
    </g>
  `;
}

function drawDualCenter(cx,cy,r,keys){
  const t1 = T[keys[0]];
  const t2 = keys[1] ? T[keys[1]] : null;
  let g = `<g>`;
  if(t2){
    const clipL = `clipL-${cx}-${cy}`;
    const clipR = `clipR-${cx}-${cy}`;
    g += `
      <clipPath id="${clipL}"><path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 0 ${cx} ${cy+r} Z"/></clipPath>
      <clipPath id="${clipR}"><path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} Z"/></clipPath>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${t1.color}"></circle>
      <path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} Z" fill="${t2.color}"></path>
      <image class="node-img" data-type-id="${t1.id}" x="${cx-r}" y="${cy-r}" width="${r*2}" height="${r*2}" clip-path="url(#${clipL})" preserveAspectRatio="xMidYMid slice"/>
      <image class="node-img" data-type-id="${t2.id}" x="${cx-r}" y="${cy-r}" width="${r*2}" height="${r*2}" clip-path="url(#${clipR})" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#fff" stroke-width="3"></circle>
      <text class="node-label" x="${cx}" y="${cy+r+16}" font-size="13" style="paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width:3px;">${t1.ja}/${t2.ja}</text>
    `;
  } else {
    g += drawNode(cx,cy,r,t1,true);
  }
  g += `</g>`;
  return g;
}

function applyNodeImages(){
  stage.querySelectorAll('image.node-img[data-type-id]').forEach(img=>{
    const id = img.getAttribute('data-type-id');
    const href = `${id}.png`;
    img.setAttributeNS('http://www.w3.org/1999/xlink','href', href);
    img.setAttribute('href', href);
    img.addEventListener('error', ()=>{ img.style.opacity = 0; });
  });
}

function attachNodeTapEvents(){
  stage.querySelectorAll('[data-node-key]').forEach(el=>{
    el.style.cursor = 'pointer';
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const k = el.getAttribute('data-node-key');
      if(mode === 'single'){
        selectedKeys = [k];
        render();
      } else {
        const max = 2;
        if(selectedKeys.includes(k)){
          selectedKeys = selectedKeys.filter(x=>x!==k);
          if(selectedKeys.length===0) selectedKeys = [k];
        } else {
          if(selectedKeys.length >= max) selectedKeys.shift();
          selectedKeys.push(k);
        }
        buildPicker();
        render();
      }
    });
  });
}

// ============================================================
// オリジナル技一覧描画
// ============================================================
function renderMoveList(){
  let filtered = MOVES;
  if(selectedKeys.length > 0) {
    const selectedJas = selectedKeys.map(k=>T[k]?.ja).filter(Boolean);
    if(selectedJas.length > 0) {
      filtered = MOVES.filter(m => selectedJas.includes(m.type));
    }
  }

  if(filtered.length === 0) {
    moveList.innerHTML = `<div style="color:var(--sub);text-align:center;padding:30px 0;">該当する技がありません</div>`;
    return;
  }

  let html = '';
  filtered.forEach(m => {
    const typeObj = TYPES.find(t=>t.ja===m.type);
    const typeId = typeObj ? typeObj.id : 0;
    const color = typeObj ? typeObj.color : '#8892a0';
    const catClass = m.category === '物理' ? 'physical' : (m.category === '特殊' ? 'special' : 'status');
    const powerStr = (m.power !== null && m.power !== undefined) ? m.power : '--';
    const accStr = (m.accuracy !== null && m.accuracy !== undefined) ? m.accuracy : '--';
    const chanceStr = (m.chance !== null && m.chance !== undefined) ? `${m.chance}%` : '--';
    const effectStr = m.effect || '--';
    const priorityStr = (m.priority !== undefined && m.priority !== 0) ? (m.priority > 0 ? `+${m.priority}` : `${m.priority}`) : '--';

    html += `
      <div class="move-card">
        <div class="move-name">${m.name}</div>
        <div class="move-type-badge" style="background:${color};">
          ${typeId ? `<img src="${typeId}.png" onerror="this.style.display='none'">` : ''}
          ${m.type}
        </div>
        <div class="move-category ${catClass}">${m.category}</div>
        <div class="move-details">
          <span><span class="label">威力</span><span class="value">${powerStr}</span></span>
          <span><span class="label">命中</span><span class="value">${accStr}</span></span>
          <span><span class="label">PP</span><span class="value">${m.pp}</span></span>
          <span><span class="label">優先度</span><span class="value">${priorityStr}</span></span>
          <span><span class="label">発動率</span><span class="value">${chanceStr}</span></span>
        </div>
        <div class="move-effect">
          ${effectStr}
          ${m.chance ? `<span class="chance">${m.chance}%</span>` : ''}
        </div>
      </div>
    `;
  });

  moveList.innerHTML = html;
}

// ============================================================
// 全画面タップ
// ============================================================
let fsAttached = false;
function attachTapToFullscreen(){
  if(fsAttached) return;
  fsAttached = true;
  document.body.addEventListener('click', requestFS, {once:false});
}
function requestFS(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen && el.requestFullscreen()) ||
    (el.webkitRequestFullscreen && el.webkitRequestFullscreen()) ||
    (el.msRequestFullscreen && el.msRequestFullscreen());
  }
  document.getElementById('fs-hint').classList.add('hide');
}
setTimeout(()=>{
  document.getElementById('fs-hint').classList.add('hide');
}, 3500);

// ============================================================
// リサイズ対応
// ============================================================
window.addEventListener('resize', ()=>{
  if(mode === 'original') renderMoveList();
  else render();
});
window.addEventListener('orientationchange', ()=>{
  setTimeout(()=>{
    if(mode === 'original') renderMoveList();
    else render();
  }, 200);
});

// ============================================================
// 初期表示
// ============================================================
typePicker.classList.remove('show');
moveList.style.display = 'none';
stage.style.display = 'block';
render();
</script>
</body>
</html>
